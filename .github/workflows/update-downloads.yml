name: Update Download Stats

on:
  schedule:
    # Every Monday at 09:00 UTC. GitHub may delay scheduled runs by a few
    # minutes to hours during high load — that's normal and fine here.
    - cron: "0 9 * * 1"
  workflow_dispatch: {}
    # Lets you trigger this manually from the Actions tab any time you want
    # an immediate refresh, instead of waiting for the weekly schedule.

permissions:
  contents: write

jobs:
  update-download-stat:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch download count and update content.js
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: node scripts/update-download-stat.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- content.js; then
            echo "No changes to commit."
          else
            git add content.js
            git commit -m "chore: update CurseForge download stat"
            git push
          fi
